<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in - Neo ERP</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/login/login.css">
</head>
<body>
  <!-- The sign-in screen, served by tools/serve.js to a browser without a session. The form posts to /login and works
       without scripts; login.js only adds the show-password button. The server puts its one-line message below the brand. -->
  <main class="lg-wrap">
    <section class="lg-card" aria-labelledby="lg-title">
      <header class="lg-brand">
        <h1 class="lg-brand__name" id="lg-title">Neo ERP</h1>
        <p class="lg-brand__by">by The Biz CFO</p>
      </header>

      <!--message-->

      <form class="lg-form" method="post" action="/login">
        <div class="lg-field">
          <label class="lg-field__label" for="lg-username">Email</label>
          <input class="lg-input" id="lg-username" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="lg-field">
          <label class="lg-field__label" for="lg-password">Password</label>
          <div class="lg-pass">
            <input class="lg-input" id="lg-password" name="password" type="password" autocomplete="current-password" required>
            <button class="lg-eye" id="lg-eye" type="button" aria-label="Show password" aria-pressed="false" title="Show password" hidden>
              <svg class="lg-eye__on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="lg-eye__off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.3 17.3 0 0 1-3.3 4.2"/><path d="M6.7 6.7C3.8 8.6 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="lg-submit" type="submit">Sign in</button>
      </form>

      <p class="lg-note">A preview on sample data. The figures are illustrative.</p>
    </section>
  </main>
  <script src="/login/login.js"></script>
</body>
</html>
